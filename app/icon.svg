<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#d9532f" />
      <stop offset="100%" stop-color="#b93815" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background Badge Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#pGrad)" />
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- "P" Badge Typography -->
  <text 
    x="64" 
    y="92" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="82" 
    font-weight="bold" 
    fill="#ffffff" 
    text-anchor="middle"
    filter="url(#shadow)"
  >P</text>
</svg>
